[package]
name = "bootstrap-executor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false
default-run = "bootstrap-executor"

[features]
default = ["source", "compiled-lowering"]
source = ["semantics"]
compiled-lowering = []
semantics = []

[[bin]]
name = "bootstrap-executor"
path = "src/main.rs"
required-features = ["semantics"]

[[bin]]
name = "bootstrap-generated"
path = "src/bin/bootstrap-generated.rs"
required-features = ["semantics"]

[[bin]]
name = "bootstrap-source"
path = "src/bin/bootstrap-source.rs"
required-features = ["source"]

[[bin]]
name = "cuestacean"
path = "src/bin/cuestacean.rs"
required-features = ["source"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9"

[lints.clippy]
unwrap_used = "deny"
