# Generated by shaka. Do not edit by hand.
# Run `shaka ci generate-workflows` to refresh.
#
# Source of truth: <slot>/<project>/project.cue.

name: cuestacean validate
on:
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  id-token: write
  contents: read
concurrency:
  group: cuestacean-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: cuestacean validate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: true
        flakehub: true
    - uses: DeterminateSystems/flakehub-cache-action@v3
    - name: Colocate jj on the git checkout
      run: nix develop './infra/tooling' --command jj git init --colocate
    - name: shaka commit lint
      if: github.event_name == 'pull_request'
      run: nix develop './infra/tooling' --command shaka commit lint -r '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'
    - name: shaka preflight
      run: nix develop './infra/tooling' --command shaka preflight
